[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedai-guard"
version = "0.1.0"
description = "嵌入式固件代码质量守卫 — AI Native 约束扫描器"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-c>=0.22",
    "pyyaml>=6.0",
]

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
